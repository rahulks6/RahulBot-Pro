[project]
name = "ais-worker"
version = "1.2.0"
description = "AI Story Studio GPU worker (Phase 2: local worker with mock models)"
requires-python = ">=3.11"
dependencies = []  # the core and the stdlib server need nothing beyond Python

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "BLE", "A", "C4", "SIM", "RUF"]
ignore = ["S603", "S607", "S101", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]
"ais_worker/models/mock.py" = ["S311"]  # deterministic placeholder generation, not cryptography

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ais_worker", "tests"]
exclude = ["ais_worker/fastapi_app.py"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "pytest", "_pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pyright]
include = ["ais_worker"]
exclude = ["ais_worker/fastapi_app.py", "**/__pycache__"]
pythonVersion = "3.11"
