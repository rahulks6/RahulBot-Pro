# Builds the AI Story Studio CLOUD worker image and publishes it to GitHub Container Registry.
# Manual only (Actions tab → "AI Story Studio worker image" → Run workflow): building never
# happens on push, so it can never surprise you with storage or compute use.
# After the first run, make the package PUBLIC once (GitHub → your profile → Packages →
# ai-story-studio-worker → Package settings → Change visibility → Public) so RunPod can pull it
# without credentials. The image contains no secrets and no model weights.
name: AI Story Studio worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: '1.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (the CUDA base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Image name (lower-case owner)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-story-studio-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ai-story-studio/worker
          file: ai-story-studio/worker/Dockerfile.cuda
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ inputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=AI Story Studio cloud worker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
